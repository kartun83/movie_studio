<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="utf-8">
	<title>Products App</title>
	<script src="https://openui5.hana.ondemand.com/resources/sap-ui-core.js"
		id="sap-ui-bootstrap"
		data-sap-ui-theme="sap_belize"
		data-sap-ui-libs="sap.m">
	</script>
</head>
<body class="sapUiBody" id="content">
	<span id="greeting"></span>
	<ul>
		<li><a href="/user-api/currentUser">1a. Using the <b>/currentUser</b> endpoint</a></li>
		<li><a href="/user-api/attributes">1b. Using the <b>/attributes</b> endpoint</a></li>
	</ul>
	<script>
		setTimeout(() => {
			fetch("/user-api/currentUser").then((res) => res.json()).then((user) => {
				document.getElementById("greeting").innerText = `Hi ${user.firstname} 👋`;
			});
		}, 1000);
	</script>
</body>
</html>
