_schema-version: "3.2"
ID: movie_studio_mta2
description: Managed movie studuo router
version: 0.0.1
modules:
- name: movie_studio_mta2-destination-content
  type: com.sap.application.content
  requires:
  - name: movie_studio_mta2-destination-service
    parameters:
      content-target: true
  - name: movie_studio_mta2-repo-host
    parameters:
      service-key:
        name: movie_studio_mta2-repo-host-key
  - name: movie_studio_mta2-uaa
    parameters:
      service-key:
        name: movie_studio_mta2-uaa-key
  parameters:
    content:
      instance:
        destinations:
        - Name: movie_studio_mta2_html_repo_host
          ServiceInstanceName: movie_studio_mta2-html5-service
          ServiceKeyName: movie_studio_mta2-repo-host-key
          sap.cloud.service: movie_studio_mta2
        - Authentication: OAuth2UserTokenExchange
          Name: movie_studio_mta2_uaa
          ServiceInstanceName: movie_studio_mta2-xsuaa-service
          ServiceKeyName: movie_studio_mta2-uaa-key
          sap.cloud.service: movie_studio_mta2
        existing_destinations_policy: update
  build-parameters:
    no-source: true
resources:
- name: movie_studio_mta2-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: movie_studio_mta2-destination-service
    service-plan: lite
- name: movie_studio_mta2-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: movie_studio_mta2-xsuaa-service
    service-plan: application
- name: movie_studio_mta2-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: movie_studio_mta2-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
