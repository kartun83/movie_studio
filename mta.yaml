_schema-version: 3.3.0
ID: movie_studio_mta
description: Movie studio applcation
version: 1.0.5
modules:


- name: movie_studio_mta-destination-content
  type: com.sap.application.content
  requires:
  - name: movie_studio_mta-destination-service
    parameters:
      content-target: true
  - name: movie_studio_mta-repo-host
    parameters:
      service-key:
        name: movie_studio_mta-repo-host-key
  - name: movie-studio-auth
    parameters:
      service-key:
        name: movie-studio-auth-key

  parameters:
    content:
      instance:
        destinations:
        - Name: movie_studio_mta_html_repo_host
          ServiceInstanceName: movie_studio_mta-html5-service
          ServiceKeyName: movie_studio_mta-repo-host-key
          sap.cloud.service: movie_studio_mta
        - Authentication: OAuth2UserTokenExchange
          # Name: movie_studio_mta_uaa
          Name: movie-studio-auth
          # ServiceInstanceName: movie_studio_mta-xsuaa-service
          ServiceInstanceName :  movie-studio-auth
          ServiceKeyName: movie-studio-auth-key
          sap.cloud.service: movie_studio_mta

        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: movie_studio_mta-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: movie_studio_mta-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - nsmoviestuidioui.zip
      name: nsmoviestuidioui
      target-path: resources/
    - artifacts:
      - comkartunmoviestudiomoviestudioassetsui.zip
      name: comkartunmoviestudiomoviestudioassetsui
      target-path: resources/    
    - artifacts:
      - comkartunmoviestudiomoviestudiohrui.zip
      name: comkartunmoviestudiomoviestudiohrui
      target-path: resources/
- name: nsmoviestuidioui
  type: html5
  path: app/movie_stuidio_ui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comkartunmoviestudiomoviestudioassetsui
  type: html5
  path: app/moviestudio_assets_ui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comkartunmoviestudiomoviestudiohrui
  type: html5
  path: app/movie_studio_hr_ui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: movie_studio_mta-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: movie_studio_mta-destination-service
    service-plan: lite
- name: movie-studio-auth
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    # service-name: movie_studio-${org}-${space}
    #service-name: movie_studio_mta-xsuaa-service
    service-plan: application
- name: movie_studio_mta-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: movie_studio_mta-html5-service
    service-plan: app-host

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
